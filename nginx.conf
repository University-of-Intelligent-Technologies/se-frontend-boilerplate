server {
	listen 80;
	root /usr/share/nginx/html;
	index index.html;

	location / {
		# SPA fallback: unknown paths (e.g. /tasks/1 after a page reload) get
		# index.html, and the client-side router renders the page
		try_files $uri $uri/ /index.html;
	}

	location /assets/ {
		# hashed JS/CSS bundles: a missing file is a real 404, not index.html
		# (otherwise the browser reports a confusing "Unexpected token '<'")
		try_files $uri =404;
	}
}
